# This workflow will install Python dependencies and run tests with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Conversion-container pytests

on:
  push:
    branches: ["gcp-cd-arxiv-development"]
  pull_request:
    branches: ["gcp-cd-arxiv-development"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LATEXML_OXIDE_VERSION: "0.7.5"
      TMPDIR: /tmp
    steps:
      - name: Install latexml-oxide
        run: |
          # The .deb is a self-contained binary; apt pulls its texlive + graphics
          # dependencies (texlive-latex-base/-extra/-science, ghostscript,
          # imagemagick, poppler-utils, mupdf-tools, dvipng, dvisvgm).
          sudo apt-get update
          curl -fsSL -o /tmp/latexml-oxide.deb \
            "https://github.com/dginev/latexml-oxide/releases/download/${LATEXML_OXIDE_VERSION}/latexml-oxide_${LATEXML_OXIDE_VERSION}-1_amd64.deb"
          sudo apt-get install -y /tmp/latexml-oxide.deb
          latexml_oxide --version

      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          cd conversion-container
          poetry install --all-extras
      - name: Test with pytest
        run: |
          cd conversion-container
          poetry run pytest
