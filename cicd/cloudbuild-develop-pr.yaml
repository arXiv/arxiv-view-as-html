steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull gcr.io/$PROJECT_ID/html-conversion:latest || echo "need a :latest because we use it for cache-from" && exit 0']
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull gcr.io/$PROJECT_ID/ar5ivist-base:latest || echo "need a :latest because we use it for cache-from" && exit 0']
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/ar5ivist-base:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ar5ivist-base:latest'
      - '-f'
      - './conversion-container/dockerfiles/Dockerfile.ar5ivist_base'
      - './conversion-container/'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/ar5ivist-base'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/html-conversion:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/html-conversion:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/html-conversion:latest'
      - '-f'
      - './conversion-container/dockerfiles/Dockerfile.main_dev'
      - './conversion-container/'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/html-conversion'
    id: Push
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - '--platform=managed'
      - >-
        --image=gcr.io/$PROJECT_ID/html-conversion:$COMMIT_SHA
      - >-
        --labels=commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - '--region=$_DEPLOY_REGION'
      # Container resources: one 6 GiB latexml-oxide conversion per instance
      # (--concurrency=1), with headroom below the --max-memory watchdog so a
      # graceful abort beats a Cloud Run OOM-kill; gen2 for the 8 GiB tier and
      # the gs/mutool/pdftocairo/ImageMagick graphics subprocesses.
      - '--cpu=4'
      - '--memory=8Gi'
      - '--concurrency=1'
      - '--execution-environment=gen2'
      # /tmp is in-RAM on Cloud Run, so oxide's disk-spill can't free memory;
      # disable streaming so the 6 GiB RSS watchdog is the single clean ceiling.
      # --update-env-vars (merge) not --set-env-vars, which would wipe the rest.
      - '--update-env-vars=LATEXML_STREAMING=false'
      # Drop the vestigial Perl-era LATEXML_COMMIT env; the worker now reads the
      # LATEXML_OXIDE_VERSION Settings (default 0.7.6). Safe if already absent.
      - '--remove-env-vars=LATEXML_COMMIT'
      - '--quiet'
    id: Deploy
    entrypoint: gcloud
images: ['gcr.io/$PROJECT_ID/html-conversion:latest', 'gcr.io/$PROJECT_ID/html-conversion:$COMMIT_SHA']



